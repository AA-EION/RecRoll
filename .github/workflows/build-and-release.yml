name: Build and Release RecRoll

on:
  push:
    branches: [ "main", "master", "feature/*", "feature/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish this build as this tag (e.g. v1.1.0). Leave empty to build without releasing."
        required: false
        default: ""
      replace_existing:
        description: "Delete any existing release and tag of that name first, so the release is recreated clean rather than updated in place."
        type: boolean
        required: false
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (Universal x64 + ARM64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      # 1. Build x64 (Intel / AMD)
      - name: Configure CMake (x64)
        run: cmake -B build-x64 -A x64

      - name: Build RecRoll (x64)
        run: cmake --build build-x64 --config Release --parallel

      # 2. Build ARM64 (Snapdragon X / Windows on ARM)
      - name: Configure CMake (ARM64)
        run: cmake -B build-arm64 -A ARM64

      - name: Build RecRoll (ARM64)
        run: cmake --build build-arm64 --config Release --parallel

      # 3. Stage Binaries for Installer
      - name: Stage binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "build/bin/x64"
          New-Item -ItemType Directory -Force -Path "build/bin/arm64"
          New-Item -ItemType Directory -Force -Path "dist"

          # Copy x64 outputs
          Get-ChildItem -Path "build-x64" -Filter "RecRoll.vst3" -Recurse | Select-Object -First 1 | ForEach-Object { Copy-Item -Recurse -Force $_.FullName "build/bin/x64/RecRoll.vst3" }
          Get-ChildItem -Path "build-x64" -Filter "RecRoll.clap" -Recurse | Select-Object -First 1 | ForEach-Object { Copy-Item -Force $_.FullName "build/bin/x64/RecRoll.clap" }
          Get-ChildItem -Path "build-x64" -Filter "*RecRoll*.exe" -Recurse | Where-Object { $_.Name -notmatch "vstest" } | Select-Object -First 1 | ForEach-Object { Copy-Item -Force $_.FullName "build/bin/x64/RecRoll.exe" }

          # Copy ARM64 outputs
          Get-ChildItem -Path "build-arm64" -Filter "RecRoll.vst3" -Recurse | Select-Object -First 1 | ForEach-Object { Copy-Item -Recurse -Force $_.FullName "build/bin/arm64/RecRoll.vst3" }
          Get-ChildItem -Path "build-arm64" -Filter "RecRoll.clap" -Recurse | Select-Object -First 1 | ForEach-Object { Copy-Item -Force $_.FullName "build/bin/arm64/RecRoll.clap" }
          Get-ChildItem -Path "build-arm64" -Filter "*RecRoll*.exe" -Recurse | Where-Object { $_.Name -notmatch "vstest" } | Select-Object -First 1 | ForEach-Object { Copy-Item -Force $_.FullName "build/bin/arm64/RecRoll.exe" }

          Write-Host "Staged x64 files:"
          Get-ChildItem "build/bin/x64"
          Write-Host "Staged arm64 files:"
          Get-ChildItem "build/bin/arm64"

          # Create portable zips
          Compress-Archive -Path "build/bin/x64/*" -DestinationPath "dist/RecRoll-Windows-x64-Portable.zip"
          Compress-Archive -Path "build/bin/arm64/*" -DestinationPath "dist/RecRoll-Windows-arm64-Portable.zip"

      # 4. Compile Unified Inno Setup Installer
      - name: Compile Windows Installer
        shell: pwsh
        run: |
          $isccPath = (Get-Command "iscc" -ErrorAction SilentlyContinue)?.Source
          if (-not $isccPath -or -not (Test-Path $isccPath)) {
            $isccPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "Using Inno Setup compiler at: $isccPath"
          & $isccPath installer\windows\RecRoll.iss

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RecRoll-Windows
          path: dist/*

  build-macos:
    name: "macOS (Universal 2: arm64 + x86_64)"
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure CMake Universal
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET="11.0"

      - name: Build Plugins and Standalone
        run: cmake --build build --config Release --parallel

      - name: Package PKG Installer and DMG
        run: |
          chmod +x installer/macos/build_installer.sh installer/macos/uninstall.sh
          ./installer/macos/build_installer.sh

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RecRoll-macOS
          path: dist/*

  release:
    name: "Create GitHub Release"
    needs: [build-windows, build-macos]
    # A tag push releases under that tag. A manual run releases only when it was
    # given a release_tag, so the button stays usable as a plain build check.
    if: ${{ always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success') && (startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != '') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: tag
        run: |
          if [ -n "${{ inputs.release_tag }}" ]; then
            echo "name=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare Release Directory
        run: |
          mkdir -p release-files
          find release-artifacts -type f -exec cp {} release-files/ \;
          ls -la release-files/

      # Recreating beats updating in place: an update leaves assets from an
      # earlier run attached to the release alongside the new ones.
      - name: Remove existing release and tag
        if: ${{ inputs.replace_existing }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Deleting existing release $TAG (and its tag)."
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          else
            echo "No existing release named $TAG."
            git push --delete origin "$TAG" 2>/dev/null || echo "No existing tag $TAG."
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: release-files/*
          generate_release_notes: true
          draft: false
          prerelease: false
